name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          # Windows-only code behind cfg(windows) is not compiled on Linux, so clippy runs there too.
          - os: windows
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rustfmt
        if: matrix.os == 'linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install taplo
        if: matrix.os == 'linux'
        uses: taiki-e/install-action@v2
        with:
          tool: taplo
      - name: Taplo
        if: matrix.os == 'linux'
        run: taplo fmt --check
      - name: Typos
        if: matrix.os == 'linux'
        uses: crate-ci/typos@v1.52.2

  commits:
    name: Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Committed
        uses: crate-ci/committed@v1.1.12

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Unit tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # Each target is built on a native runner, like the image matrix in moonbase-studio-web.
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [lint, deny, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    permissions:
      contents: read
    env:
      PACKAGE: moonbase-bridge-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p moonbase-bridge --target ${{ matrix.target }}
      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: |
          mkdir -p "dist/$PACKAGE"
          cp "target/${{ matrix.target }}/release/moonbase-bridge" README.md "dist/$PACKAGE/"
          tar -C dist -czf "dist/$PACKAGE.tar.gz" "$PACKAGE"
      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/$env:PACKAGE" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/moonbase-bridge.exe", README.md "dist/$env:PACKAGE/"
          Compress-Archive -Path "dist/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}.*
          if-no-files-found: error
          retention-days: 30
