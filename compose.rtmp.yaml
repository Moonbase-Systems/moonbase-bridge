# Local RTMP ingest for Bridge / FFmpeg dev tests.
# `just rtmp-up` starts this stack; see docs/rtmp-dev.md.

services:
  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    container_name: moonbase-mediamtx
    # Image ENTRYPOINT is already `mediamtx`; only pass the config path.
    command: ["/mediamtx.yml"]
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935" # RTMP publish + play
      - "8554:8554" # RTSP (optional)
      - "8888:8888" # HLS (optional, good for VLC)
    restart: unless-stopped
